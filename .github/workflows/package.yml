name: package

on:
  push:
    paths:
      - plugin.json
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Install deps
        run: pnpm install

      - name: Get current version
        uses: emptylight370/jq-action@v1
        id: version
        with:
          data: plugin.json
          filter: .version

      - name: Package
        run: pnpm build

      - name: Generate release log
        run: |
          conventional-changelog -o release.md -n changelog.json -k plugin.json -c plugin.json
          git cliff -u -o release.md -t ${{ steps.version.outputs.result }}
          prettier -w release.md

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: package.zip
          name: Release ${{ steps.version.outputs.result }}
          tag_name: ${{ steps.version.outputs.result }}
          make_latest: true
          body_path: release.md
